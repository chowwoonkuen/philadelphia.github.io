<!DOCTYPE html>
<html lang="zh-hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>聖經難字粵音 — 閱讀</title>
  <link rel="stylesheet" href="/philadelphia.github.io/assets/css/style.css"/>
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    /* ── Top bar ── */
    .viewer-bar {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .6rem 1rem;
      background: var(--surf);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(60,40,20,.08);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .viewer-back {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      color: var(--text2);
      font-size: .88rem;
      padding: .35rem .65rem;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: var(--surf);
      transition: all .18s;
      white-space: nowrap;
    }
    .viewer-back::before { content: '←'; }
    .viewer-back:hover { color: var(--gold); border-color: var(--gold); background: var(--gold-bg); }
    .viewer-title {
      font-family: var(--font-s);
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .viewer-dl {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: var(--gold);
      color: #fff;
      font-size: .82rem;
      font-weight: 600;
      padding: .38rem .85rem;
      border-radius: var(--r);
      transition: background .18s;
      white-space: nowrap;
      text-decoration: none;
    }
    .viewer-dl:hover { background: var(--gold-lt); }
    .viewer-dl::before { content: '↓'; font-size: .95rem; }

    /* ── PDF frame area ── */
    .viewer-frame {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--surf2);
    }
    .viewer-frame iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── Mobile fallback banner ── */
    .mobile-notice {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex: 1;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .mobile-notice .notice-icon { font-size: 2.8rem; }
    .mobile-notice p { color: var(--text2); font-size: .92rem; line-height: 1.6; }
    .mobile-notice .dl-big {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--gold);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: .75rem 1.6rem;
      border-radius: var(--r-lg);
      text-decoration: none;
      transition: background .18s;
    }
    .mobile-notice .dl-big:hover { background: var(--gold-lt); }

    /* On very small screens where PDF embed fails, show fallback */
    @media (max-width: 480px) {
      .viewer-frame { display: none; }
      .mobile-notice { display: flex; }
    }
  </style>
</head>
<body>
  <div class="viewer-bar">
    <a href="/philadelphia.github.io/zh-hant/bible/index.html" class="viewer-back">書目</a>
    <span class="viewer-title" id="barTitle">聖經難字粵音</span>
    <a id="dlBtn" href="#" download class="viewer-dl">下載 PDF</a>
  </div>

  <div class="viewer-frame" id="frameWrap">
    <iframe id="pdfFrame" title="PDF 閱讀器"></iframe>
  </div>

  <div class="mobile-notice" id="mobileNotice">
    <span class="notice-icon">📖</span>
    <p>此頁面在手機上可能無法直接預覽 PDF，<br/>請點擊下方按鈕下載後閱讀。</p>
    <a id="dlBig" href="#" download class="dl-big">↓ 下載 PDF</a>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var filename = params.get('pdf') || '';

      if (!filename) {
        document.getElementById('barTitle').textContent = '找不到檔案';
        return;
      }

      // Build PDF URL relative to this page — no hash, no version param
      var base = location.pathname.replace(/\/[^/]*$/, '/');
      var pdfUrl = base + filename;

      // Derive book name from filename: strip leading digits + 'b', strip .pdf
      var bookName = filename.replace(/^\d+b?/, '').replace(/\.pdf$/i, '');
      document.title = bookName + ' — 聖經難字粵音';
      document.getElementById('barTitle').textContent = bookName;

      // Set iframe src
      document.getElementById('pdfFrame').src = pdfUrl;

      // Set download links (plain URL, no hash)
      document.getElementById('dlBtn').href = pdfUrl;
      document.getElementById('dlBtn').setAttribute('download', filename);
      document.getElementById('dlBig').href = pdfUrl;
      document.getElementById('dlBig').setAttribute('download', filename);
    })();
  </script>
</body>
</html>
