    .month-grid {{ display: none; }}
    .month-grid.visible {{ display: block; }}
    .month-name {{
      font-family: var(--font-s);
      font-size: 1.1rem;
      color: var(--gold-text);
      margin-bottom: 1rem;
    }}
    .days-grid {{
      display: grid;
      grid-template-columns: repeat(7,1fr);
      gap: .45rem;
    }}
    .day-tile {{
      aspect-ratio: 1;
