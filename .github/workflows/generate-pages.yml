    .month-tabs {{
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-bottom: 2rem;
    }}
    .mtab {{
      padding: .35rem .75rem;
      border-radius: 99px;
      font-size: .8rem;
