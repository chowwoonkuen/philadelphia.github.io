name: Build & Deploy

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO ADD CONTENT  (no HTML editing ever needed — just upload & push)
#
#   屬靈書  → zh-hant/shuiling/    any PDF filename
#   圣经    → zh-hant/bible/       filename must contain 2-digit book number
#             e.g. 創世記01.pdf  約翰福音43.pdf  啟示錄66.pdf
#   靈修    → zh-hant/devotional/  name as MM.DD.pdf  e.g. 01.01.pdf  12.31.pdf
#   詩歌    → zh-hant/poetry/      one sub-folder per song
#             e.g. zh-hant/poetry/01 歌名/歌名.pdf
#                  zh-hant/poetry/01 歌名/歌名.mp3
#   (replace zh-hant with zh-hans for simplified Chinese)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick ghostscript

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Ensure directories
        run: |
          for lang in zh-hant zh-hans; do
            for cat in shuiling devotional poetry bible; do
              mkdir -p "$lang/$cat"
              mkdir -p "assets/thumbs/$lang/$cat"
            done
          done
          mkdir -p assets/css

      # ── Thumbnails: FULL first page, no cropping ──────────────────────────────
      # Resize to 320px wide, keeping natural aspect ratio, white background.
      # Only generates missing thumbnails (skips existing ones).
      - name: Generate shuiling thumbnails
        run: |
          for lang in zh-hant zh-hans; do
            src="$lang/shuiling"
            dst="assets/thumbs/$lang/shuiling"
            for f in "$src"/*.pdf; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .pdf)
              [ -f "$dst/$name.png" ] && continue
              convert -density 150 "$f"[0] \
                -resize 320x \
                -background white -flatten \
                "$dst/$name.png" 2>/dev/null || true
            done
          done

      # ── Write Python generator scripts ────────────────────────────────────────
      - name: Write generator scripts
        run: |

          # ── gen_shuiling.py ──────────────────────────────────────────────────
          cat > /tmp/gen_shuiling.py << 'PYEOF'
#!/usr/bin/env python3
import os, sys

lang  = sys.argv[1]
repo  = sys.argv[2]
title = sys.argv[3]
back  = sys.argv[4]

src_dir   = f"{lang}/shuiling"
thumb_dir = f"/{repo}/assets/thumbs/{lang}/shuiling"
base      = f"/{repo}/{lang}/shuiling"
back_url  = f"/{repo}/{lang}/index.html"

files = sorted([f for f in os.listdir(src_dir) if f.endswith('.pdf')]) if os.path.isdir(src_dir) else []

html = f'''<!DOCTYPE html>
<html lang="{lang}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{title}</title>
  <link rel="stylesheet" href="/{repo}/assets/css/style.css"/>
  <style>
    .lib-grid {{
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1.5rem;
    }}
    .book-card {{
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transition: all .22s;
    }}
    .book-card:hover {{
      border-color: var(--gold-lt);
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }}
    .thumb-wrap {{
      width: 100%;
      aspect-ratio: 1 / 1.414;
      position: relative;
      overflow: hidden;
      background: var(--surf2);
    }}
    .thumb-wrap .skeleton {{
      position: absolute;
      inset: 0;
      border-radius: 0;
    }}
    .book-thumb {{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--surf2);
      opacity: 0;
      transition: opacity .3s;
    }}
    .book-thumb.loaded {{ opacity: 1; }}
    .book-info {{
      padding: .85rem;
      display: flex;
      flex-direction: column;
      gap: .65rem;
      flex: 1;
    }}
    .book-name {{
      font-family: var(--font-s);
      font-size: .8rem;
      color: var(--text);
      line-height: 1.5;
      word-break: break-word;
    }}
    .book-actions {{
      display: flex;
      gap: .5rem;
      margin-top: auto;
    }}
    .book-actions .btn {{ flex: 1; font-size: .78rem; padding: .45rem .4rem; }}
    @media (max-width: 480px) {{
      .lib-grid {{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }}
    }}
  </style>
</head>
<body>
  <div class="page">
    <a href="{back_url}" class="back">{back}</a>
    <h1 class="sec-title">{title}</h1>
    <div class="lib-grid">
'''
for fname in files:
    stem      = fname[:-4]
    thumb_url = f"{thumb_dir}/{stem}.png"
    pdf_url   = f"{base}/{fname}"
    html += f'''      <div class="book-card">
        <div class="thumb-wrap">
          <div class="skeleton"></div>
          <img class="book-thumb"
               src="{thumb_url}"
               alt="{stem}"
               loading="lazy"
               onload="this.classList.add('loaded')"
               onerror="this.parentElement.querySelector('.skeleton').style.animation='none';this.remove()"/>
        </div>
        <div class="book-info">
          <p class="book-name">{stem}</p>
          <div class="book-actions">
            <a href="{pdf_url}" target="_blank" class="btn btn-outline">閱讀</a>
            <a href="{pdf_url}" download class="btn btn-gold">下載</a>
          </div>
        </div>
      </div>
'''
if not files:
    html += '      <p style="color:var(--text2);grid-column:1/-1;padding:2rem 0">尚無資料 — 上傳 PDF 後自動顯示</p>\n'
html += '    </div>\n  </div>\n</body>\n</html>\n'

out = f"{lang}/shuiling/index.html"
os.makedirs(os.path.dirname(out), exist_ok=True)
with open(out, 'w', encoding='utf-8') as f:
    f.write(html)
print(f"Written {out} ({len(files)} books)")
PYEOF

