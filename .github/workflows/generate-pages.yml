#!/usr/bin/env python3
import os, sys, glob

lang  = sys.argv[1]
repo  = sys.argv[2]
title = sys.argv[3]
back  = sys.argv[4]

poetry_dir = f"{lang}/poetry"
base       = f"/{repo}/{lang}/poetry"
back_url   = f"/{repo}/{lang}/index.html"

songs = []
if os.path.isdir(poetry_dir):
    for entry in sorted(os.scandir(poetry_dir), key=lambda e: e.name):
        if not entry.is_dir(): continue
        pdfs = sorted(glob.glob(os.path.join(entry.path,'*.pdf')))
        mp3s = sorted(glob.glob(os.path.join(entry.path,'*.mp3')))
        songs.append({'name':entry.name,
                      'pdf':pdfs[0] if pdfs else None, 'pdf_name':os.path.basename(pdfs[0]) if pdfs else None,
                      'mp3':mp3s[0] if mp3s else None, 'mp3_name':os.path.basename(mp3s[0]) if mp3s else None})

SONG_STYLE = f'''  <link rel="stylesheet" href="/{repo}/assets/css/style.css"/>
  <style>
    html,body{{height:100%;}}
    body{{display:flex;flex-direction:column;}}
    .song-wrap{{flex:1;display:flex;flex-direction:column;max-width:960px;margin:0 auto;width:100%;padding:1.2rem 1rem 2rem;}}
    .song-title{{font-family:var(--font-s);font-size:clamp(1.1rem,3vw,1.6rem);font-weight:700;color:var(--text);margin-bottom:1.2rem;}}
    .pdf-section{{flex:1;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:1rem;min-height:55vh;box-shadow:var(--shadow);display:flex;flex-direction:column;}}
    .pdf-section iframe{{flex:1;width:100%;min-height:55vh;border:none;display:block;}}
    .pdf-missing{{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:.9rem;padding:2rem;}}
    .audio-section{{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:1rem 1.2rem;margin-bottom:1rem;box-shadow:var(--shadow);}}
    .audio-label{{font-size:.8rem;color:var(--text2);margin-bottom:.6rem;font-weight:500;}}
    audio{{width:100%;}}
    .audio-missing{{color:var(--text3);font-size:.85rem;padding:.3rem 0;}}
    .dl-row{{display:flex;gap:.75rem;flex-wrap:wrap;}}
    .dl-row .btn{{min-width:130px;}}
  </style>'''

for s in songs:
    su   = f"{base}/{s['name']}"
    purl = f"{su}/{s['pdf_name']}" if s['pdf'] else None
    murl = f"{su}/{s['mp3_name']}" if s['mp3'] else None
    sh = f'''<!DOCTYPE html>
<html lang="{lang}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{s['name']}</title>
{SONG_STYLE}
</head>
<body>
  <div class="song-wrap">
    <a href="{base}/index.html" class="back">{title}</a>
    <h1 class="song-title">{s['name']}</h1>
    <div class="pdf-section">
'''
    if purl:
        sh += f'      <iframe src="{purl}" title="{s["name"]}"></iframe>\n'
    else:
        sh += '      <div class="pdf-missing">PDF 尚未上傳</div>\n'
    sh += '    </div>\n    <div class="audio-section">\n      <div class="audio-label">🎵 音頻播放</div>\n'
    if murl:
        sh += f'      <audio controls preload="metadata"><source src="{murl}" type="audio/mpeg"/>您的瀏覽器不支援音頻播放。</audio>\n'
    else:
        sh += '      <div class="audio-missing">MP3 尚未上傳</div>\n'
    sh += '    </div>\n    <div class="dl-row">\n'
    if purl:
        sh += f'      <a href="{purl}" download class="btn btn-gold">⬇ 下載 PDF</a>\n'
        sh += f'      <a href="{purl}" target="_blank" class="btn btn-outline">🔗 在瀏覽器打開 PDF</a>\n'
    if murl:
        sh += f'      <a href="{murl}" download class="btn btn-outline">⬇ 下載 MP3</a>\n'
    sh += '    </div>\n  </div>\n</body>\n</html>\n'
    op = f"{lang}/poetry/{s['name']}/index.html"
    os.makedirs(os.path.dirname(op), exist_ok=True)
    with open(op,'w',encoding='utf-8') as f: f.write(sh)

html = f'''<!DOCTYPE html>
<html lang="{lang}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{title}</title>
  <link rel="stylesheet" href="/{repo}/assets/css/style.css"/>
