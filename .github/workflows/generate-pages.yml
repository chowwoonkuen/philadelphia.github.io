      color: var(--gold-text);
      transform: scale(1.08);
      box-shadow: 0 3px 12px rgba(201,160,80,.2);
      z-index: 1;
    }}
    .day-tile.miss {{
      background: var(--miss);
      border: 1px dashed var(--miss-bdr);
      color: var(--text3);
    }}
    .day-tile.today-marker {{
      background: var(--today) !important;
