#!/usr/bin/env python3
import os, sys, re, glob

lang  = sys.argv[1]
repo  = sys.argv[2]
title = sys.argv[3]
back  = sys.argv[4]

poetry_dir = f"{lang}/poetry"
base       = f"/{repo}/{lang}/poetry"
back_url   = f"/{repo}/{lang}/index.html"

# Collect song folders (subdirectories, sorted)
songs = []
if os.path.isdir(poetry_dir):
    for entry in sorted(os.scandir(poetry_dir), key=lambda e: e.name):
        if not entry.is_dir():
            continue
        song_dir = entry.path
        song_name = entry.name
        pdfs  = sorted(glob.glob(os.path.join(song_dir, '*.pdf')))
        mp3s  = sorted(glob.glob(os.path.join(song_dir, '*.mp3')))
        pdf   = pdfs[0]  if pdfs  else None
        mp3   = mp3s[0]  if mp3s  else None
        songs.append({'name': song_name, 'pdf': pdf, 'mp3': mp3,
                      'pdf_name': os.path.basename(pdf) if pdf else None,
                      'mp3_name': os.path.basename(mp3) if mp3 else None})

# ── Generate individual song pages ────────────────────────────────────────
for s in songs:
    song_dir_url = f"{base}/{s['name']}"
    song_page    = f"{lang}/poetry/{s['name']}/index.html"
    pdf_url      = f"{song_dir_url}/{s['pdf_name']}" if s['pdf'] else None
    mp3_url      = f"{song_dir_url}/{s['mp3_name']}" if s['mp3'] else None

    sh = f'''<!DOCTYPE html>
<html lang="{lang}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{s['name']}</title>
  <link rel="stylesheet" href="/{repo}/assets/css/style.css"/>
  <style>
    body {{ display: flex; flex-direction: column; min-height: 100vh; }}
    .song-wrap {{ flex: 1; display: flex; flex-direction: column; padding: 1.2rem 1rem 2rem; max-width: 900px; margin: 0 auto; width: 100%; }}
    .song-title {{ font-family: var(--font-s); font-size: clamp(1.1rem,3vw,1.5rem); color: var(--gold-text); margin-bottom: 1.2rem; }}
    .pdf-wrap {{
      flex: 1;
      min-height: 60vh;
      background: var(--surf2);
      border-radius: var(--r-lg);
      overflow: hidden;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
    }}
    .pdf-wrap iframe {{
      flex: 1;
      width: 100%;
      min-height: 60vh;
      border: none;
      display: block;
    }}
    .pdf-fallback {{ display:none; text-align:center; padding: 2rem; color: var(--text2); font-size:.9rem; }}
    .audio-section {{
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
    }}
    .audio-label {{ font-size: .78rem; color: var(--text2); margin-bottom: .6rem; letter-spacing: .05em; }}
    audio {{ width: 100%; border-radius: 4px; }}
    .dl-row {{ display: flex; gap: .75rem; flex-wrap: wrap; }}
    .dl-row .btn {{ min-width: 120px; justify-content: center; }}
  </style>
</head>
<body>
  <div class="song-wrap">
    <a href="{base}/index.html" class="back">{title}</a>
    <h1 class="song-title">{s['name']}</h1>
'''
    if pdf_url:
        sh += f'''    <div class="pdf-wrap">
      <iframe src="{pdf_url}" title="{s['name']}">
        <div class="pdf-fallback">
          您的瀏覽器不支援直接顯示 PDF。<br/>
          <a href="{pdf_url}" download class="btn btn-gold" style="margin-top:1rem">下載 PDF</a>
        </div>
      </iframe>
    </div>
'''
    else:
        sh += '    <div class="pdf-wrap" style="align-items:center;justify-content:center"><p style="color:var(--text3)">PDF 尚未上傳</p></div>\n'

    if mp3_url:
        sh += f'''    <div class="audio-section">
      <div class="audio-label">🎵 音頻播放</div>
      <audio controls preload="metadata">
        <source src="{mp3_url}" type="audio/mpeg"/>
        您的瀏覽器不支援音頻播放。
      </audio>
    </div>
'''
    sh += '    <div class="dl-row">\n'
    if pdf_url:
        sh += f'      <a href="{pdf_url}" download class="btn btn-gold">⬇ 下載 PDF</a>\n'
        sh += f'      <a href="{pdf_url}" target="_blank" class="btn btn-outline">🔗 在瀏覽器打開</a>\n'
    if mp3_url:
        sh += f'      <a href="{mp3_url}" download class="btn btn-outline">⬇ 下載 MP3</a>\n'
    sh += '''    </div>
  </div>
</body>
</html>
'''
    os.makedirs(os.path.dirname(song_page), exist_ok=True)
    with open(song_page, 'w', encoding='utf-8') as f:
        f.write(sh)

# ── Generate poetry index page ─────────────────────────────────────────────
html = f'''<!DOCTYPE html>
<html lang="{lang}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{title}</title>
  <link rel="stylesheet" href="/{repo}/assets/css/style.css"/>
  <style>
    .song-list {{ display: flex; flex-direction: column; gap: .75rem; max-width: 700px; }}
    .song-row {{
      display: flex;
      align-items: center;
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 1rem 1.2rem;
      gap: 1rem;
      transition: all .25s;
      text-decoration: none;
    }}
    .song-row:hover {{ background: var(--surf2); border-color: var(--gold-dim); transform: translateX(4px); }}
    .song-num {{ font-size: .75rem; color: var(--text3); min-width: 24px; font-family: var(--font-b); }}
    .song-info {{ flex: 1; }}
    .song-name {{ font-family: var(--font-s); font-size: 1rem; color: var(--text); }}
    .song-badges {{ display: flex; gap: .4rem; margin-top: .3rem; }}
    .badge {{ font-size: .65rem; padding: .15rem .45rem; border-radius: 99px; border: 1px solid; }}
    .badge-pdf {{ border-color: var(--gold-dim); color: var(--gold-dim); }}
    .badge-mp3 {{ border-color: #4a7a4a; color: #6baa6b; }}
    .badge-miss {{ border-color: var(--text3); color: var(--text3); }}
    .song-arrow {{ color: var(--text3); font-size: .9rem; }}
  </style>
</head>
<body>
  <div class="page">
    <a href="{back_url}" class="back">{back}</a>
    <h1 class="sec-title">{title}</h1>
    <div class="song-list">
'''

for i, s in enumerate(songs, 1):
    song_url = f"{base}/{s['name']}/index.html"
    pdf_badge = '<span class="badge badge-pdf">PDF</span>' if s['pdf'] else '<span class="badge badge-miss">PDF 待上傳</span>'
    mp3_badge = '<span class="badge badge-mp3">MP3</span>' if s['mp3'] else '<span class="badge badge-miss">MP3 待上傳</span>'
    html += f'''      <a href="{song_url}" class="song-row">
        <span class="song-num">{i:02d}</span>
        <div class="song-info">
          <div class="song-name">{s['name']}</div>
          <div class="song-badges">{pdf_badge}{mp3_badge}</div>
        </div>
        <span class="song-arrow">›</span>
      </a>
'''

if not songs:
    html += '      <p style="color:var(--text2)">尚未上傳詩歌 — 請在 poetry/ 目錄下建立各詩歌子資料夾</p>\n'

html += f'''    </div>
  </div>
</body>
</html>
'''

out = f"{lang}/poetry/index.html"
os.makedirs(os.path.dirname(out), exist_ok=True)
with open(out, 'w', encoding='utf-8') as f:
    f.write(html)
print(f"Written {out} ({len(songs)} songs)")
