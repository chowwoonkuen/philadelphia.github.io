#!/usr/bin/env python3
import os, sys, re

lang  = sys.argv[1]
repo  = sys.argv[2]
title = sys.argv[3]
back  = sys.argv[4]

MONTHS_TW = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月']
DAYS = [31,29,31,30,31,30,31,31,30,31,30,31]

dev_dir = f"{lang}/devotional"
base    = f"/{repo}/{lang}/devotional"
back_url= f"/{repo}/{lang}/index.html"

existing = set()
if os.path.isdir(dev_dir):
    for fname in os.listdir(dev_dir):
        m = re.match(r'^(\d{2})\.(\d{2})\.pdf$', fname)
        if m:
            existing.add((int(m.group(1)), int(m.group(2))))

total   = sum(DAYS)
present = len(existing)

html = f'''<!DOCTYPE html>
<html lang="{lang}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{title}</title>
  <link rel="stylesheet" href="/{repo}/assets/css/style.css"/>
  <style>
