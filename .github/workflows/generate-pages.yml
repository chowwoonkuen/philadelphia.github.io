name: Generate Static Pages, Thumbnails & Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      site-dir: .
    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout repository
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # -------------------------------------------------
      # 2️⃣ Install system tools
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick ghostscript

      # -------------------------------------------------
      # 3️⃣ Prepare root‑level folder structure
      # -------------------------------------------------
      - name: Prepare root directories
        run: |
          # clean any previous generated assets
          rm -rf assets/thumbs
          rm -rf assets/css
          rm -rf zh-hant
          rm -rf zh-hans

          mkdir -p assets/thumbs/zh-hant/{shuiling,bible,poetry,devotional}
          mkdir -p assets/thumbs/zh-hans/{shuiling,bible,poetry,devotional}
          mkdir -p assets/css
          mkdir -p zh-hant/{shuiling,bible,poetry,devotional}
          mkdir -p zh-hans/{shuiling,bible,poetry,devotional}

          # copy PDFs into the root folders
          cp -r zh-hant/* zh-hant/ 2>/dev/null || true
          cp -r zh-hans/* zh-hans/ 2>/dev/null || true

          # copy CSS (handles both possible locations)
          if [ -f assets/css/style.css ]; then
            cp assets/css/style.css assets/css/style.css
          elif [ -f assets/style.css ]; then
            cp assets/style.css assets/css/style.css
          fi

      # -------------------------------------------------
      # 4️⃣ Generate thumbnails (writes into assets/thumbs)
      # -------------------------------------------------
      - name: Generate PDF Thumbnails
        run: |
          set -euo pipefail
          generate_thumbnails() {
            local src_dir="$1"
            local out_dir="$2"
            mkdir -p "$out_dir"
            for file in "$src_dir"/*.pdf; do
              [ -e "$file" ] || continue
              local name=$(basename "$file" .pdf)
              convert -density 150 "$file"[0] -thumbnail 200x200^ -gravity center -extent 200x200 "$out_dir/$name.png"
            done
          }

          generate_thumbnails zh-hant/shuiling assets/thumbs/zh-hant/shuiling
          generate_thumbnails zh-hant/bible    assets/thumbs/zh-hant/bible
          generate_thumbnails zh-hant/poetry   assets/thumbs/zh-hant/poetry
          generate_thumbnails zh-hant/devotional assets/thumbs/zh-hant/devotional

          generate_thumbnails zh-hans/shuiling assets/thumbs/zh-hans/shuiling
          generate_thumbnails zh-hans/bible    assets/thumbs/zh-hans/bible
          generate_thumbnails zh-hans/poetry   assets/thumbs/zh-hans/poetry
          generate_thumbnails zh-hans/devotional assets/thumbs/zh-hans/devotional

          # give ImageMagick a moment to finish writing files
          sleep 2

      # -------------------------------------------------
      # 5️⃣ Generate HTML pages (using only echo)
      # -------------------------------------------------
      - name: Generate HTML Pages (using echo)
        run: |
          set -euo pipefail
          generate_html() {
            local lang=$1
            local cat=$2
            local title=$3
            local out_dir="$lang/$cat"
            mkdir -p "$out_dir"

            echo '<!DOCTYPE html>' > "$out_dir/index.html"
            echo "<html lang=\"$lang\">" >> "$out_dir/index.html"
            echo '<head>' >> "$out_dir/index.html"
            echo '  <meta charset="UTF-8"/>' >> "$out_dir/index.html"
            echo "  <title>$title</title>" >> "$out_dir/index.html"
            echo '  <link rel="stylesheet" href="/assets/css/style.css"/>' >> "$out_dir/index.html"
            echo '</head>' >> "$out_dir/index.html"
            echo '<body>' >> "$out_dir/index.html"
            echo '  <div class="container">' >> "$out_dir/index.html"
            echo "    <h1>$title</h1>" >> "$out_dir/index.html"
            echo '    <div class="icon-grid">' >> "$out_dir/index.html"

            for file in "$lang/$cat"/*.pdf; do
              [ -e "$file" ] || continue
              local fname=$(basename "$file")
              local thumb="/assets/thumbs/$lang/$cat/$(basename "$file" .pdf).png"
              echo "<a href=\"/$lang/$cat/$fname\" class=\"icon\" download><img src=\"$thumb\" alt=\"$fname\"/><span>$fname</span></a>" >> "$out_dir/index.html"
            done

            echo '    </div>' >> "$out_dir/index.html"
            echo '  </div>' >> "$out_dir/index.html"
            echo '</body>' >> "$out_dir/index.html"
            echo '</html>' >> "$out_dir/index.html"
          }

          generate_html zh-hant shuiling   "屬靈書"
          generate_html zh-hant bible      "聖經難字粵音"
          generate_html zh-hant poetry     "詩歌"
          generate_html zh-hant devotional "靈修資料"

          generate_html zh-hans shuiling   "属灵书"
          generate_html zh-hans bible      "圣经难字粤音"
          generate_html zh-hans poetry     "诗歌"
          generate_html zh-hans devotional "灵修资料"

      # -------------------------------------------------
      # 6️⃣ (Optional) Commit generated files back to repo
      # -------------------------------------------------
      - name: (Optional) Commit generated files back to repo
        if: ${{ always() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets zh-hant zh-hans || true
          if [ -n "$(git status --porcelain assets zh-hant zh-hans)" ]; then
            git commit -m "Auto‑generate pages and thumbnails" || true
            git push origin main || true
          else
            echo "No changes to commit"
          fi

      # -------------------------------------------------
      # 7️⃣ Upload artifact for deployment (root of repo)
      # -------------------------------------------------
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: .

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
