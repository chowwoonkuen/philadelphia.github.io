name: Build & Deploy

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO ADD CONTENT  (no HTML editing ever needed — just upload files & push)
#
#   屬靈書  / 属灵书   → drop PDF into  zh-hant/shuiling/  or  zh-hans/shuiling/
#   聖經    / 圣经     → drop PDF into  zh-hant/bible/     or  zh-hans/bible/
#                        name it so the file contains the 2-digit book number
#                        e.g. 創世記01.pdf  出埃及記02.pdf  啟示錄66.pdf
#   靈修資料/ 灵修资料  → drop PDF into  zh-hant/devotional/ or zh-hans/devotional/
#                        name it  MM.DD.pdf  e.g. 01.01.pdf  12.31.pdf
#   詩歌    / 诗歌     → create a sub-folder per song, put one PDF + one MP3 inside
#                        e.g. zh-hant/poetry/01 歌名/歌名.pdf
#                             zh-hant/poetry/01 歌名/歌名.mp3
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick ghostscript

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Ensure directories
        run: |
          for lang in zh-hant zh-hans; do
            for cat in shuiling devotional poetry bible; do
              mkdir -p "$lang/$cat"
              mkdir -p "assets/thumbs/$lang/$cat"
            done
          done
          mkdir -p assets/css

      # ── Shuiling thumbnails (portrait, skips existing) ──────────────────────
      - name: Generate shuiling thumbnails
        run: |
          gen_thumbs() {
            local src="$1" dst="$2"
            for f in "$src"/*.pdf; do
              [ -e "$f" ] || continue
              local name; name=$(basename "$f" .pdf)
              [ -f "$dst/$name.png" ] && continue
              convert -density 150 "$f"[0] \
                -resize 300x420 -gravity center \
                -background '#1a1714' -extent 300x420 \
                "$dst/$name.png" 2>/dev/null || true
            done
          }
          gen_thumbs zh-hant/shuiling assets/thumbs/zh-hant/shuiling
          gen_thumbs zh-hans/shuiling assets/thumbs/zh-hans/shuiling

      # ── Write Python generator scripts ──────────────────────────────────────
      - name: Write generator scripts
        run: |
          # ── gen_shuiling.py ──────────────────────────────────────────────────
          cat > /tmp/gen_shuiling.py << 'PYEOF'
#!/usr/bin/env python3
import os, sys

lang  = sys.argv[1]   # zh-hant / zh-hans
repo  = sys.argv[2]   # philadelphia.github.io
title = sys.argv[3]   # 屬靈書 / 属灵书
back  = sys.argv[4]   # 繁體中文 / 简体中文

src_dir  = f"{lang}/shuiling"
thumb_dir = f"/{repo}/assets/thumbs/{lang}/shuiling"
base     = f"/{repo}/{lang}/shuiling"
back_url = f"/{repo}/{lang}/index.html"

files = sorted([f for f in os.listdir(src_dir) if f.endswith('.pdf')]) if os.path.isdir(src_dir) else []

html = f'''<!DOCTYPE html>
<html lang="{lang}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{title}</title>
  <link rel="stylesheet" href="/{repo}/assets/css/style.css"/>
  <style>
    .lib-grid {{
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }}
    .book-card {{
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all .25s;
    }}
    .book-card:hover {{ border-color: var(--gold-dim); transform: translateY(-3px); box-shadow: var(--shadow); }}
    .book-thumb {{
      width: 100%;
      aspect-ratio: 5/7;
      object-fit: cover;
      display: block;
      background: var(--surf2);
    }}
    .book-thumb-placeholder {{
      width: 100%;
      aspect-ratio: 5/7;
      background: var(--surf2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      font-size: .8rem;
    }}
    .book-info {{
      padding: .85rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }}
    .book-name {{
      font-size: .82rem;
      color: var(--text);
      line-height: 1.45;
      word-break: break-word;
    }}
    .book-actions {{
      display: flex;
      gap: .5rem;
      margin-top: auto;
    }}
    .book-actions .btn {{ flex: 1; justify-content: center; font-size: .78rem; padding: .45rem .5rem; }}
    @media (max-width: 480px) {{
      .lib-grid {{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }}
    }}
  </style>
</head>
<body>
  <div class="page">
    <a href="{back_url}" class="back">{back}</a>
    <h1 class="sec-title">{title}</h1>
    <div class="lib-grid">
'''

for fname in files:
    stem = fname[:-4]
    thumb_url = f"{thumb_dir}/{stem}.png"
    pdf_url   = f"{base}/{fname}"
    has_thumb = os.path.isfile(f"assets/thumbs/{lang}/shuiling/{stem}.png")
    thumb_el  = f'<img class="book-thumb" src="{thumb_url}" alt="{stem}" loading="lazy"/>' if has_thumb else f'<div class="book-thumb-placeholder">無預覽</div>'
    html += f'''      <div class="book-card">
        {thumb_el}
        <div class="book-info">
          <p class="book-name">{stem}</p>
          <div class="book-actions">
            <a href="{pdf_url}" target="_blank" class="btn btn-outline">閱讀</a>
            <a href="{pdf_url}" download class="btn btn-gold">下載</a>
          </div>
        </div>
      </div>
'''

if not files:
    html += '      <p style="color:var(--text2);grid-column:1/-1">尚無資料 — 上傳 PDF 後自動顯示</p>\n'

html += '''    </div>
  </div>
</body>
</html>
'''

out = f"{lang}/shuiling/index.html"
os.makedirs(os.path.dirname(out), exist_ok=True)
with open(out, 'w', encoding='utf-8') as f:
    f.write(html)
print(f"Written {out}")
PYEOF

          # ── gen_bible.py ─────────────────────────────────────────────────────
          cat > /tmp/gen_bible.py << 'PYEOF'
#!/usr/bin/env python3
import os, sys, re

lang  = sys.argv[1]
repo  = sys.argv[2]
title = sys.argv[3]
back  = sys.argv[4]

BOOKS = [
    (1,'創','創世記','律法書'),(2,'出','出埃及記','律法書'),(3,'利','利未記','律法書'),
    (4,'民','民數記','律法書'),(5,'申','申命記','律法書'),
    (6,'書','約書亞記','歷史書'),(7,'士','士師記','歷史書'),(8,'得','路得記','歷史書'),
    (9,'撒上','撒母耳記上','歷史書'),(10,'撒下','撒母耳記下','歷史書'),
    (11,'王上','列王紀上','歷史書'),(12,'王下','列王紀下','歷史書'),
    (13,'代上','歷代志上','歷史書'),(14,'代下','歷代志下','歷史書'),
    (15,'拉','以斯拉記','歷史書'),(16,'尼','尼希米記','歷史書'),(17,'斯','以斯帖記','歷史書'),
    (18,'伯','約伯記','詩歌書'),(19,'詩','詩篇','詩歌書'),(20,'箴','箴言','詩歌書'),
    (21,'傳','傳道書','詩歌書'),(22,'歌','雅歌','詩歌書'),
    (23,'賽','以賽亞書','大先知書'),(24,'耶','耶利米書','大先知書'),
    (25,'哀','耶利米哀歌','大先知書'),(26,'結','以西結書','大先知書'),(27,'但','但以理書','大先知書'),
    (28,'何','何西阿書','小先知書'),(29,'珥','約珥書','小先知書'),(30,'摩','阿摩司書','小先知書'),
    (31,'俄','俄巴底亞書','小先知書'),(32,'拿','約拿書','小先知書'),(33,'彌','彌迦書','小先知書'),
    (34,'鴻','鴻姆書','小先知書'),(35,'哈','哈巴谷書','小先知書'),(36,'番','西番雅書','小先知書'),
    (37,'該','哈該書','小先知書'),(38,'亞','撒迦利亞書','小先知書'),(39,'瑪','瑪拉基書','小先知書'),
    (40,'太','馬太福音','福音書'),(41,'可','馬可福音','福音書'),
    (42,'路','路加福音','福音書'),(43,'約','約翰福音','福音書'),
    (44,'徒','使徒行傳','使徒行傳'),
    (45,'羅','羅馬書','書信'),(46,'林前','哥林多前書','書信'),(47,'林後','哥林多後書','書信'),
    (48,'加','加拉太書','書信'),(49,'弗','以弗所書','書信'),(50,'腓','腓立比書','書信'),
    (51,'西','歌羅西書','書信'),(52,'帖前','帖撒羅尼迦前書','書信'),(53,'帖後','帖撒羅尼迦後書','書信'),
    (54,'提前','提摩太前書','書信'),(55,'提後','提摩太後書','書信'),(56,'多','提多書','書信'),
    (57,'門','腓利門書','書信'),(58,'來','希伯來書','書信'),(59,'雅','雅各書','書信'),
    (60,'彼前','彼得前書','書信'),(61,'彼後','彼得後書','書信'),
    (62,'約一','約翰一書','書信'),(63,'約二','約翰二書','書信'),(64,'約三','約翰三書','書信'),
    (65,'猶','猶大書','書信'),(66,'啟','啟示錄','啟示錄'),
]

CAT_ORDER = ['律法書','歷史書','詩歌書','大先知書','小先知書','福音書','使徒行傳','書信','啟示錄']
CAT_LABEL = {
    '律法書':'律法書',  '歷史書':'歷史書', '詩歌書':'詩歌書',
    '大先知書':'大先知書','小先知書':'小先知書','福音書':'福音書',
    '使徒行傳':'使徒行傳','書信':'書信','啟示錄':'啟示錄',
}
# For zh-hans, swap to simplified labels
if lang == 'zh-hans':
    CAT_LABEL = {
        '律法書':'律法书','歷史書':'历史书','詩歌書':'诗歌书',
        '大先知書':'大先知书','小先知書':'小先知书','福音書':'福音书',
        '使徒行傳':'使徒行传','書信':'书信','啟示錄':'启示录',
    }

# Scan existing files and map book_num → filename
bible_dir = f"{lang}/bible"
existing = {}
if os.path.isdir(bible_dir):
    for fname in os.listdir(bible_dir):
        if fname.lower().endswith('.pdf'):
            nums = re.findall(r'\d+', os.path.splitext(fname)[0])
            for n in nums:
                ni = int(n)
                if 1 <= ni <= 66:
                    existing[ni] = fname
                    break

base     = f"/{repo}/{lang}/bible"
back_url = f"/{repo}/{lang}/index.html"

# Group books by category
from collections import defaultdict
cats = defaultdict(list)
for b in BOOKS:
    cats[b[3]].append(b)

html = f'''<!DOCTYPE html>
<html lang="{lang}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{title}</title>
  <link rel="stylesheet" href="/{repo}/assets/css/style.css"/>
  <style>
    .testament-header {{
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2.5rem 0 1rem;
    }}
    .testament-label {{
      font-family: var(--font-s);
      font-size: .75rem;
      font-weight: 600;
      color: var(--gold-dim);
      letter-spacing: .15em;
      text-transform: uppercase;
      white-space: nowrap;
    }}
    .testament-line {{
      flex: 1;
      height: 1px;
      background: var(--border);
    }}
    .testament-divider {{
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--gold-dim), transparent);
      margin: 2.5rem 0 2rem;
    }}
    .cat-section {{ margin-bottom: 1.5rem; }}
    .cat-label {{
      font-size: .7rem;
      color: var(--text3);
      letter-spacing: .12em;
      margin-bottom: .75rem;
      font-family: var(--font-b);
    }}
    .books-grid {{
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      gap: .6rem;
    }}
    .book-tile {{
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: var(--r);
      text-align: center;
      padding: .3rem .2rem;
      transition: all .2s;
      position: relative;
    }}
    .book-tile.avail {{
      background: var(--surf);
      border: 1px solid var(--gold-dim);
      cursor: pointer;
      text-decoration: none;
    }}
    .book-tile.avail:hover {{
      background: var(--surf2);
      border-color: var(--gold);
      transform: scale(1.06);
      box-shadow: 0 4px 16px rgba(201,160,80,.25);
    }}
    .book-tile.miss {{
      background: var(--miss);
      border: 1px dashed var(--miss-bdr);
    }}
    .book-abbr {{
      font-family: var(--font-s);
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1;
    }}
    .book-tile.avail .book-abbr {{ color: var(--gold-text); }}
    .book-tile.miss .book-abbr  {{ color: var(--text3); }}
    .book-fullname {{
      font-size: .58rem;
      margin-top: .2rem;
      line-height: 1.2;
      display: none;
    }}
    .book-tile.avail .book-fullname {{ color: var(--text2); }}
    .book-tile.miss .book-fullname  {{ color: var(--text3); }}
    .book-num {{
      position: absolute;
      top: 3px; right: 5px;
      font-size: .5rem;
      color: var(--text3);
    }}
    @media (min-width: 420px) {{
      .books-grid {{ grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }}
      .book-fullname {{ display: block; }}
      .book-abbr {{ font-size: 1.15rem; }}
    }}
    @media (min-width: 700px) {{
      .books-grid {{ grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: .7rem; }}
    }}
    .stat-bar {{
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      font-size: .82rem;
      color: var(--text2);
    }}
    .stat-dot {{ width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }}
    .stat-avail {{ background: var(--surf); border: 1px solid var(--gold-dim); }}
    .stat-miss  {{ background: var(--miss); border: 1px dashed var(--miss-bdr); }}
  </style>
</head>
<body>
  <div class="page">
    <a href="{back_url}" class="back">{back}</a>
    <h1 class="sec-title">{title}</h1>
    <div class="stat-bar">
      <span class="stat-dot stat-avail"></span><span>已上傳 ({len(existing)}/66)</span>
      <span class="stat-dot stat-miss"></span><span>尚未上傳</span>
    </div>
'''

for i, cat in enumerate(CAT_ORDER):
    if cat not in cats:
        continue
    if cat in ('福音書','使徒行傳','書信','啟示錄') and i > 0 and CAT_ORDER[i-1] not in ('福音書','使徒行傳','書信','啟示錄'):
        html += '    <div class="testament-divider"></div>\n'
        nt_label = '新約聖經' if lang == 'zh-hant' else '新约圣经'
        html += f'    <div class="testament-header"><span class="testament-label">{nt_label}</span><div class="testament-line"></div></div>\n'
    if i == 0:
        ot_label = '舊約聖經' if lang == 'zh-hant' else '旧约圣经'
        html += f'    <div class="testament-header"><span class="testament-label">{ot_label}</span><div class="testament-line"></div></div>\n'

    html += f'    <div class="cat-section">\n'
    html += f'      <div class="cat-label">{CAT_LABEL[cat]}</div>\n'
    html += f'      <div class="books-grid">\n'
    for (num, abbr, name, _) in cats[cat]:
        if num in existing:
            url = f"{base}/{existing[num]}"
            html += f'        <a href="{url}" target="_blank" class="book-tile avail" title="{name}">\n'
            html += f'          <span class="book-num">{num:02d}</span>\n'
            html += f'          <span class="book-abbr">{abbr}</span>\n'
            html += f'          <span class="book-fullname">{name}</span>\n'
            html += f'        </a>\n'
        else:
            html += f'        <div class="book-tile miss" title="{name}（未上傳）">\n'
            html += f'          <span class="book-num">{num:02d}</span>\n'
            html += f'          <span class="book-abbr">{abbr}</span>\n'
            html += f'          <span class="book-fullname">{name}</span>\n'
            html += f'        </div>\n'
    html += '      </div>\n    </div>\n'

html += '''  </div>
</body>
</html>
'''

out = f"{lang}/bible/index.html"
os.makedirs(os.path.dirname(out), exist_ok=True)
with open(out, 'w', encoding='utf-8') as f:
    f.write(html)
print(f"Written {out}")
PYEOF

