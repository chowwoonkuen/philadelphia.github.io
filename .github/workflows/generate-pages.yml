name: Generate Static Pages, Thumbnails & Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      site-dir: .
    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout repository
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # -------------------------------------------------
      # 2️⃣ Install system tools
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick ghostscript

      # -------------------------------------------------
      # 3️⃣ Prepare folder structure (preserve existing assets)
      # -------------------------------------------------
      - name: Prepare directories
        run: |
          mkdir -p assets/thumbs/zh-hant/{shuiling,bible,poetry,devotional}
          mkdir -p assets/thumbs/zh-hans/{shuiling,bible,poetry,devotional}
          mkdir -p assets/css
          mkdir -p zh-hant/{shuiling,bible,poetry,devotional}
          mkdir -p zh-hans/{shuiling,bible,poetry,devotional}

          cp -r zh-hant/* zh-hant/ 2>/dev/null || true
          cp -r zh-hans/* zh-hans/ 2>/dev/null || true

          if [ -f assets/css/style.css ]; then
            cp assets/css/style.css assets/css/style.css
          elif [ -f assets/style.css ]; then
            cp assets/style.css assets/css/style.css
          fi

      # -------------------------------------------------
      # 4️⃣ Generate PDF thumbnails (writes into assets/thumbs)
      # -------------------------------------------------
      - name: Generate PDF Thumbnails
        run: |
          set -euo pipefail
          generate_thumbnails() {
            local src_dir="$1"
            local out_dir="$2"
            mkdir -p "$out_dir"
            for file in "$src_dir"/*.pdf; do
              [ -e "$file" ] || continue
              local name=$(basename "$file" .pdf)
              convert -density 150 "$file"[0] -thumbnail 200x200^ -gravity center -extent 200x200 "$out_dir/$name.png"
            done
          }

          generate_thumbnails zh-hant/shuiling assets/thumbs/zh-hant/shuiling
          generate_thumbnails zh-hant/bible    assets/thumbs/zh-hant/bible
          generate_thumbnails zh-hant/poetry   assets/thumbs/zh-hant/poetry
          generate_thumbnails zh-hant/devotional assets/thumbs/zh-hant/devotional

          generate_thumbnails zh-hans/shuiling assets/thumbs/zh-hans/shuiling
          generate_thumbnails zh-hans/bible    assets/thumbs/zh-hans/bible
          generate_thumbnails zh-hans/poetry   assets/thumbs/zh-hans/poetry
          generate_thumbnails zh-hans/devotional assets/thumbs/zh-hans/devotional

          sleep 2

      # -------------------------------------------------
      # 5️⃣ Generate HTML pages (using echo) – **fixed paths**
      # -------------------------------------------------
      - name: Generate HTML Pages (using echo)
        run: |
          set -euo pipefail
          REPO="philadelphia.github.io"   # <-- repository name, used for correct URLs

          generate_html() {
            local lang=$1
            local cat=$2
            local title=$3
            local out_dir="$lang/$cat"
            mkdir -p "$out_dir"

            {
              echo '<!DOCTYPE html>'
              echo "<html lang=\"$lang\">"
              echo '<head>'
              echo '  <meta charset="UTF-8"/>'
              echo "  <title>$title</title>"
              # CSS path now includes the repo name
              echo "  <link rel=\"stylesheet\" href=\"/${REPO}/assets/css/style.css\"/>"
              echo '</head>'
              echo '<body>'
              echo '  <div class="container">'
              echo "    <h1>$title</h1>"
              echo '    <div class="icon-grid">'

              for file in "$lang/$cat"/*.pdf; do
                [ -e "$file" ] || continue
                fname=$(basename "$file")
                thumb="/${REPO}/assets/thumbs/$lang/$cat/${fname%.pdf}.png"
                # PDF link also includes the repo name
                echo "<a href=\"/${REPO}/$lang/$cat/$fname\" class=\"icon\" download><img src=\"$thumb\" alt=\"$fname\"/><span>$fname</span></a>"
              done

              echo '    </div>'
              echo '  </div>'
              echo '</body>'
              echo '</html>'
            } > "$out_dir/index.html"
          }

          generate_html zh-hant shuiling   "屬靈書"
          generate_html zh-hant bible      "聖經難字粵音"
          generate_html zh-hant poetry     "詩歌"
          generate_html zh-hant devotional "靈修資料"

          generate_html zh-hans shuiling   "属灵书"
          generate_html zh-hans bible      "圣经难字粤音"
          generate_html zh-hans poetry     "诗歌"
          generate_html zh-hans devotional "灵修资料"

      # -------------------------------------------------
      # 6️⃣ (Optional) Commit generated files back to repo
      # -------------------------------------------------
      - name: (Optional) Commit generated files back to repo
        if: ${{ always() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets zh-hant zh-hans || true
          if [ -n "$(git status --porcelain assets zh-hant zh-hans)" ]; then
            git commit -m "Auto‑generate pages and thumbnails" || true
            git push origin main || true
          else
            echo "No changes to commit"
          fi

      # -------------------------------------------------
      # 7️⃣ Upload the **entire repository root** as the Pages artifact
      # -------------------------------------------------
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: .   # includes HTML, CSS, PDFs, thumbnails, everything

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: .

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
