name: Generate Static Pages, Thumbnails & Deploy to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      site-dir: public
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick ghostscript
          mkdir -p public/assets/thumbs/zh-hant/{shuiling,bible,poetry,devotional} \
                   public/assets/thumbs/zh-hans/{shuiling,bible,poetry,devotional}
          mkdir -p public/zh-hant/{shuiling,bible,poetry,devotional}
          mkdir -p public/zh-hans/{shuiling,bible,poetry,devotional}
          mkdir -p public/assets/css
          # copy your css (adjust path if different)
          cp -f assets/css/style.css public/assets/css/style.css || true
          # copy PDF source files into public so links work (adjust source paths if different)
          cp -r zh-hant public/ || true
          cp -r zh-hans public/ || true

      - name: Generate PDF Thumbnails
        run: |
          function generate_thumbnails {
            local src_dir=$1
            local thumb_dir=$2
            mkdir -p "$thumb_dir"
            for file in "$src_dir"/*.pdf; do
              [ -e "$file" ] || continue
              filename=$(basename "$file" .pdf)
              convert -density 150 "$file"[0] -thumbnail 200x200^ -gravity center -extent 200x200 "$thumb_dir/$filename.png"
            done
          }

          generate_thumbnails zh-hant/shuiling public/assets/thumbs/zh-hant/shuiling
          generate_thumbnails zh-hant/bible public/assets/thumbs/zh-hant/bible
          generate_thumbnails zh-hant/poetry public/assets/thumbs/zh-hant/poetry
          generate_thumbnails zh-hant/devotional public/assets/thumbs/zh-hant/devotional

          generate_thumbnails zh-hans/shuiling public/assets/thumbs/zh-hans/shuiling
          generate_thumbnails zh-hans/bible public/assets/thumbs/zh-hans/bible
          generate_thumbnails zh-hans/poetry public/assets/thumbs/zh-hans/poetry
          generate_thumbnails zh-hans/devotional public/assets/thumbs/zh-hans/devotional

      - name: Generate HTML Pages
        run: |
          function generate_html {
            local lang=$1
            local cat=$2
            local title=$3
            local out_dir="public/$lang/$cat"
            mkdir -p "$out_dir"

            echo '<!DOCTYPE html>' > "$out_dir/index.html"
            echo "<html lang=\"$lang\">" >> "$out_dir/index.html"
            echo '<head>' >> "$out_dir/index.html"
            echo '  <meta charset="UTF-8"/>' >> "$out_dir/index.html"
            echo "  <title>$title</title>" >> "$out_dir/index.html"
            echo '  <link rel="stylesheet" href="/assets/css/style.css"/>' >> "$out_dir/index.html"
            echo '</head>' >> "$out_dir/index.html"
            echo '<body>' >> "$out_dir/index.html"
            echo '  <div class="container">' >> "$out_dir/index.html"
            echo "    <h1>$title</h1>" >> "$out_dir/index.html"
            echo '    <div class="icon-grid">' >> "$out_dir/index.html"

            for file in "$lang/$cat"/*.pdf; do
              [ -e "$file" ] || continue
              filename=$(basename "$file")
              thumb="/assets/thumbs/$lang/$cat/$(basename "$file" .pdf).png"
              echo "<a href=\"/$lang/$cat/$filename\" class=\"icon\" download><img src=\"$thumb\" alt=\"$filename\"/><span>$filename</span></a>" >> "$out_dir/index.html"
            done

            echo '    </div>' >> "$out_dir/index.html"
            echo '  </div>' >> "$out_dir/index.html"
            echo '</body>' >> "$out_dir/index.html"
            echo '</html>' >> "$out_dir/index.html"
          }

          generate_html zh-hant shuiling "屬靈書"
          generate_html zh-hant bible "聖經難字粵音"
          generate_html zh-hant poetry "詩歌"
          generate_html zh-hant devotional "靈修資料"

          generate_html zh-hans shuiling "属灵书"
          generate_html zh-hans bible "圣经难字粤音"
          generate_html zh-hans poetry "诗歌"
          generate_html zh-hans devotional "灵修资料"

      - name: Commit generated files (optional)
        if: ${{ always() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public || true
          if [ -n "$(git status --porcelain public)" ]; then
            git commit -m "Auto-generate pages and thumbnails" || true
            git push origin main || true
          else
            echo "No changes to commit"
          fi

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
