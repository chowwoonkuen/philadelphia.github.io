  </style>
</head>
<body>
  <div class="page">
    <a href="{back_url}" class="back">{back}</a>
    <h1 class="sec-title">{title}</h1>
    <div class="song-list">
'''
for i,s in enumerate(songs,1):
    su = f"{base}/{s['name']}/index.html"
    pb = '<span class="badge badge-pdf">PDF ✓</span>' if s['pdf'] else '<span class="badge badge-miss">PDF 待上傳</span>'
    mb = '<span class="badge badge-mp3">MP3 ✓</span>' if s['mp3'] else '<span class="badge badge-miss">MP3 待上傳</span>'
    html += f'      <a href="{su}" class="song-row"><span class="song-num">{i:02d}</span><div class="song-info"><div class="song-name">{s["name"]}</div><div class="song-badges">{pb}{mb}</div></div><span class="song-arrow">›</span></a>\n'
if not songs:
    html += '      <p style="color:var(--text2);padding:2rem 0">尚未上傳詩歌 — 請在 poetry/ 目錄下建立各詩歌子資料夾</p>\n'
html += '    </div>\n  </div>\n</body>\n</html>\n'
out = f"{lang}/poetry/index.html"
os.makedirs(os.path.dirname(out), exist_ok=True)
with open(out,'w',encoding='utf-8') as f: f.write(html)
print(f"Written {out} ({len(songs)} songs)")
