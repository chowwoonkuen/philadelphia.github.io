name: Generate Static Pages, Thumbnails & Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The default GITHUB_TOKEN already has the needed scopes, but we keep the
# explicit permissions block for clarity.
permissions:
  contents: write      # needed for the commit that adds the generated files
  pages: write        # needed for the deploy‑pages action
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ${{ steps.set-artifact-path.outputs.path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install system deps
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick ghostscript

      - name: Create thumbnail directories
        run: |
          mkdir -p assets/thumbs/zh-hant/{shuiling,bible,poetry,devotional} \
                   assets/thumbs/zh-hans/{shuiling,bible,poetry,devotional}

      - name: Generate PDF thumbnails
        run: |
          generate_thumbnails () {
            local src=$1
            local dst=$2
            for f in "$src"/*.pdf; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .pdf)
              convert -density 150 "$f"[0] -thumbnail 200x200^ -gravity center -extent 200x200 "$dst/$name.png"
            done
          }

          generate_thumbnails zh-hant/shuiling assets/thumbs/zh-hant/shuiling
          generate_thumbnails zh-hant/bible    assets/thumbs/zh-hant/bible
          generate_thumbnails zh-hant/poetry   assets/thumbs/zh-hant/poetry
          generate_thumbnails zh-hant/devotional assets/thumbs/zh-hant/devotional

          generate_thumbnails zh-hans/shuiling assets/thumbs/zh-hans/shuiling
          generate_thumbnails zh-hans/bible    assets/thumbs/zh-hans/bible
          generate_thumbnails zh-hans/poetry   assets/thumbs/zh-hans/poetry
          generate_thumbnails zh-hans/devotional assets/thumbs/zh-hans/devotional

      - name: Generate HTML pages
        run: |
          generate_html () {
            local lang=$1
            local cat=$2
            local title=$3
            mkdir -p "$lang/$cat"

            cat > "$lang/$cat/index.html" <<EOF
<!DOCTYPE html>
<html lang="$lang">
<head>
  <meta charset="UTF-8">
  <title>$title</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="container">
    <h1>$title</h1>
    <div class="icon-grid">
EOF

            for f in "$lang/$cat"/*.pdf; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              thumb="../../assets/thumbs/$lang/$cat/${name%.pdf}.png"
              cat >> "$lang/$cat/index.html" <<HTML
<a href="$name" class="icon" download>
  <img src="$thumb" alt="$name"/>
  <span>$name</span>
</a>
HTML
            done

            cat >> "$lang/$cat/index.html" <<EOF
    </div>
  </div>
</body>
</html>
EOF
          }

          generate_html zh-hant shuiling "屬靈書"
          generate_html zh-hant bible    "聖經難字粵音"
          generate_html zh-hant poetry   "詩歌"
          generate_html zh-hant devotional "靈修資料"

          generate_html zh-hans shuiling "属灵书"
          generate_html zh-hans bible    "圣经难字粤音"
          generate_html zh-hans poetry   "诗歌"
          generate_html zh-hans devotional "灵修资料"

      - name: Commit generated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto‑generate pages and thumbnails"
            git push
          fi

      - name: Set artifact path output
        id: set-artifact-path
        run: echo "path=." >> $GITHUB_OUTPUT

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository (needed for the upload‑pages‑artifact action)
        uses: actions/checkout@v3

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the generated static files are needed.  The path “.” works
          # because the previous job already committed the generated files to the
          # repo, but you could also limit it to a sub‑folder if you prefer.
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
