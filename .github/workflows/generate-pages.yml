name: Build & Deploy

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO ADD CONTENT  (no HTML editing ever needed — just upload & push)
#
#   屬靈書  → zh-hant/shuiling/    any PDF filename
#   圣经    → zh-hant/bible/       filename must contain 2-digit book number
#             e.g. 創世記01.pdf  約翰福音43.pdf  啟示錄66.pdf
#   靈修    → zh-hant/devotional/  name as MM.DD.pdf  e.g. 01.01.pdf
#   詩歌    → zh-hant/poetry/      one sub-folder per song, with .pdf + .mp3 inside
#   (replace zh-hant with zh-hans for simplified Chinese)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick ghostscript

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Ensure directories exist
        run: |
          for lang in zh-hant zh-hans; do
            for cat in shuiling devotional poetry bible; do
              mkdir -p "$lang/$cat"
              mkdir -p "assets/thumbs/$lang/$cat"
            done
          done
          mkdir -p assets/css

      # Full first-page thumbnail, no cropping, white background, 320px wide
      - name: Generate shuiling thumbnails
        run: |
          for lang in zh-hant zh-hans; do
            src="$lang/shuiling"
            dst="assets/thumbs/$lang/shuiling"
            for f in "$src"/*.pdf; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .pdf)
              convert -density 150 "$f"[0] \
                -resize 320x \
                -background white -flatten \
                "$dst/$name.png" 2>/dev/null || true
            done
          done

      - name: Generate all section pages
        run: |
          python3 .github/scripts/gen_shuiling.py   zh-hant "$REPO" "屬靈書"       "繁體中文"
          python3 .github/scripts/gen_shuiling.py   zh-hans "$REPO" "属灵书"       "简体中文"
          python3 .github/scripts/gen_bible.py      zh-hant "$REPO" "聖經難字粵音" "繁體中文"
          python3 .github/scripts/gen_bible.py      zh-hans "$REPO" "圣经难字粤音" "简体中文"
          python3 .github/scripts/gen_devotional.py zh-hant "$REPO" "靈修資料"     "繁體中文"
          python3 .github/scripts/gen_devotional.py zh-hans "$REPO" "灵修资料"     "简体中文"
          python3 .github/scripts/gen_poetry.py     zh-hant "$REPO" "詩歌"         "繁體中文"
          python3 .github/scripts/gen_poetry.py     zh-hans "$REPO" "诗歌"         "简体中文"

      - name: Commit generated files
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add assets zh-hant zh-hans
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: auto-generate pages & thumbnails [skip ci]"
            git push origin main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
