    .stat-line {{ font-size: .82rem; color: var(--text2); margin-bottom: .5rem; }}
  </style>
</head>
<body>
  <div class="page">
    <a href="{back_url}" class="back">{back}</a>
    <h1 class="sec-title">{title}</h1>
    <p class="stat-line">已上傳 {present} / {total} 天</p>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="month-tabs">
'''

for i, mname in enumerate(MONTHS_TW):
    html += f'      <button class="mtab" data-m="{i}" onclick="showMonth({i})">{mname}</button>\n'

html += '    </div>\n'

for mi, mname in enumerate(MONTHS_TW):
    mm = mi + 1
    days = DAYS[mi]
    html += f'    <div class="month-grid" id="m{mi}">\n'
    html += f'      <div class="month-name">{mname}</div>\n'
    html += '      <div class="days-grid">\n'
    for d in range(1, days + 1):
        key   = (mm, d)
        date_str = f'{mm:02d}.{d:02d}'
        if key in existing:
            url = f"{base}/{date_str}.pdf"
            html += f'        <a href="{url}" target="_blank" class="day-tile avail" data-date="{date_str}" title="{date_str}">\n'
            html += f'          <span class="day-num">{d}</span><div class="day-dot"></div>\n'
            html += f'        </a>\n'
        else:
            html += f'        <div class="day-tile miss" data-date="{date_str}" title="{date_str}（未上傳）">\n'
            html += f'          <span class="day-num">{d}</span><div class="day-dot"></div>\n'
            html += f'        </div>\n'
    html += '      </div>\n    </div>\n'

html += '''  </div>
  <script>
    function showMonth(idx) {
      document.querySelectorAll('.month-grid').forEach(el => el.classList.remove('visible'));
      document.querySelectorAll('.mtab').forEach(el => el.classList.remove('active'));
      document.getElementById('m' + idx).classList.add('visible');
      document.querySelectorAll('.mtab')[idx].classList.add('active');
    }
    // Highlight today and open its month
    (function() {
      const t = new Date();
      const mm = String(t.getMonth()+1).padStart(2,'0');
      const dd = String(t.getDate()).padStart(2,'0');
      const key = mm + '.' + dd;
      const el = document.querySelector('[data-date="' + key + '"]');
      if (el) el.classList.add('today-marker');
      showMonth(t.getMonth());
    })();
  </script>
</body>
</html>
'''

out = f"{lang}/devotional/index.html"
os.makedirs(os.path.dirname(out), exist_ok=True)
with open(out, 'w', encoding='utf-8') as f:
    f.write(html)
print(f"Written {out}")
